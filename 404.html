<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="robots" content="noindex">
  <title>Sound System Go</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <script>
    (function () {
      var path = window.location.pathname;
      var door = path.match(/^\/portaria\/([A-Za-z0-9]{6})\/?$/);
      if (door) {
        window.location.replace('https://app.soundsystemgo.com/#/portaria/' + door[1].toUpperCase());
        return;
      }
      if (/^\/(event|profile)\//.test(path)) {
        window.location.replace('/');
      }
    })();
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #0a0a0a; color: #f5f5f5; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box; text-align: center; }
    img { width: 96px; height: 96px; border-radius: 22px; }
    p { margin: 0; color: #a5a5a5; }
    a { color: #ffbf00; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/icone.png" alt="Sound System Go">
    <p>Página não encontrada.</p>
    <a href="/">Ir para o Sound System Go</a>
  </main>
</body>
</html>
